name: Build and deploy RAVANA download portal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Verify production frontend build
        run: npm run build

      - name: Assemble download-only Pages site
        id: package
        run: |
          mkdir -p pages-site/downloads
          cp site/index.html pages-site/index.html
          git archive --format=zip --prefix=RAVANA/ -o pages-site/downloads/ravana-source.zip HEAD
          python3 - <<'PY'
          from zipfile import ZipFile

          archive = ZipFile('pages-site/downloads/ravana-source.zip')
          names = archive.namelist()
          forbidden = ('.git/', 'node_modules/', '.ravana-data/')
          bad = [name for name in names if any(part in name for part in forbidden)]
          secrets = [name for name in names if name.endswith('/.env') or '/.env.' in name and not name.endswith('/.env.example')]
          if bad or secrets:
              raise SystemExit(f'Unsafe paths in source archive: {bad + secrets}')
          PY
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          sed -i "s|__SOURCE_COMMIT__|$(git rev-parse --short HEAD)|g" pages-site/index.html
          touch pages-site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
